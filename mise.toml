[tools]
go = "1.26"
"github:golangci/golangci-lint" = "2.1.6"

[tasks.build-windows-amd64]
description = "Build the Windows amd64 executable"
run = [
  "mkdir -p build/windows-amd64",
  "GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o build/windows-amd64/cod-settings-patcher.exe .",
]
