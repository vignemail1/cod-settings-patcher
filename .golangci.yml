version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
